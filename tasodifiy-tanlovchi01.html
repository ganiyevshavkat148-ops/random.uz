<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasodifiy tanlovchi</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1d1b2e;--mut:#6b6880;--acc:#6c4cf5;--acc2:#e11d68;--line:#e5e1f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1c30;--ink:#f1eefc;--mut:#a9a6c2;--line:#33304d}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1f1c30;--ink:#f1eefc;--mut:#a9a6c2;--line:#33304d}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 420px at 0% -5%,rgba(108,76,245,.16),transparent),radial-gradient(800px 420px at 100% 0%,rgba(225,29,104,.12),transparent);background-repeat:no-repeat;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.top{max-width:1000px;margin:0 auto;padding:14px 16px 2px}
h1{margin:0;font-size:23px;display:inline-block;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;margin:0 0 8px}
main{max-width:1000px;margin:0 auto;padding:8px 12px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;min-width:0;box-shadow:0 8px 28px rgba(60,40,140,.08)}
.view{display:none}
body[data-view=wheel] .v-wheel,body[data-view=list] .v-list,body[data-view=simple] .v-simple,body[data-view=set] .v-set{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;padding:5px 2px;border:0;border-radius:14px;background:none;color:var(--mut);font:600 12px system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--acc);background:var(--bg)}
button{font-family:inherit}
.main{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-size:18px;font-weight:800;letter-spacing:.5px;cursor:pointer;box-shadow:0 8px 20px rgba(108,76,245,.35);transition:transform .1s}
.main:active{transform:scale(.98)}
.main:disabled{opacity:.7}
.sm{min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font-size:14px;cursor:pointer}
.tg{min-height:44px;padding:8px 14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.tg.on{border-color:var(--acc);background:var(--acc);color:#fff}
.tg.on:not(.sw)::after{content:" ✓"}
.tg.sw{min-width:84px}
.tg.sw::before{content:"O’chiq"}
.tg.sw.on::before{content:"Yoqiq"}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row.c{justify-content:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;padding:8px 10px;border:0;background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
textarea{width:100%;min-height:170px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;resize:vertical}
.cnt{color:var(--mut);font-size:13px}
.hide{display:none}
.stage{position:relative;isolation:isolate;width:min(100%,max(50vh,240px),460px);margin:8px auto 12px;transition:transform .8s cubic-bezier(.2,.9,.3,1.2)}
.stage::before{content:"";position:absolute;inset:5%;border-radius:50%;box-shadow:0 18px 50px rgba(108,76,245,.35);z-index:-1}
.stage.win{transform:scale(1.04)}
.stage.win::after{content:"";position:absolute;inset:3%;border-radius:50%;border:4px solid #22c55e;pointer-events:none;animation:ring 1.1s ease-out forwards}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.4);opacity:0}}
canvas{width:100%;height:auto;display:block;cursor:pointer;touch-action:manipulation}
.ptr{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid var(--acc2);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));z-index:2}
.cf{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3;pointer-events:none}
.cf i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fly 1.5s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 120px)) rotate(var(--r));opacity:0}}
.res{position:relative;margin-top:8px;padding-top:30px;min-height:100px;text-align:center;overflow:hidden}
.win-wrap{position:relative;display:inline-block;max-width:100%;isolation:isolate}
.rays{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:repeating-conic-gradient(rgba(251,191,36,.45) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 66%);mask:radial-gradient(circle,#000 8%,transparent 66%);animation:rot 10s linear infinite;z-index:-1;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
.crown{position:absolute;left:50%;top:-28px;margin-left:-16px;font-size:30px;animation:drop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-40px) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.big{display:inline-flex;align-items:center;gap:12px;max-width:100%;padding:10px 20px;border:2px solid #22c55e;border-radius:18px;background:var(--card);box-shadow:0 0 22px rgba(34,197,94,.45);font-size:clamp(20px,6vw,28px);font-weight:800;word-break:break-word;animation:pop .6s}
.big img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-weight:600;font-size:14px}
.chip img{width:28px;height:28px;border-radius:50%;object-fit:cover}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.out{min-height:110px;padding:24px 8px;text-align:center;font-size:clamp(24px,7vw,34px);font-weight:800;word-break:break-word}
.out.hit{animation:pop .5s;color:var(--acc);text-shadow:0 0 18px var(--acc2)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:10px}
.th{position:relative;text-align:center}
.th img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.th input{width:100%;margin-top:4px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px;text-align:center}
.th button{position:absolute;top:-4px;right:4px;width:30px;height:30px;border:0;border-radius:50%;background:var(--acc2);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.file{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 14px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set .seg{min-width:170px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;max-width:90vw;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;text-align:center;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.fin{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(30,20,70,.6),rgba(8,5,20,.92));overflow:hidden}
.fin.on{display:flex;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fin-rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(251,191,36,.28) 0 7deg,transparent 7deg 14deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 62%);mask:radial-gradient(circle,#000 5%,transparent 62%);animation:rot 14s linear infinite;pointer-events:none}
.fin-rain{position:absolute;inset:0;pointer-events:none}
.fin-rain i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.fin-box{position:relative;width:100%;max-width:520px;padding:26px 18px;text-align:center;color:#fff;border:3px solid #fbbf24;border-radius:26px;background:linear-gradient(160deg,#2a1f5e,#14102e);box-shadow:0 0 60px rgba(251,191,36,.6);animation:finpop .9s cubic-bezier(.2,1.4,.4,1) both}
.fin-box .cnt{color:#cfc9ee}
@keyframes finpop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.fin-tr{font-size:72px;line-height:1;animation:bnc 1.2s ease-in-out infinite}
@keyframes bnc{50%{transform:translateY(-12px) scale(1.08)}}
.fin-lab{margin:8px 0 4px;font-size:14px;font-weight:900;letter-spacing:4px;color:#fbbf24}
.fin-name{margin:6px 0 8px;font-size:clamp(32px,10vw,56px);font-weight:900;line-height:1.1;word-break:break-word;background:linear-gradient(90deg,#fbbf24,#ff5c8a,#8b7bff,#fbbf24);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.fin-img{display:block;width:120px;height:120px;margin:8px auto;border:4px solid #fbbf24;border-radius:50%;object-fit:cover;animation:pop .7s .3s both}
@media(min-width:900px){
nav{position:static;max-width:1000px;margin:0 auto;padding:8px 12px;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
nav button{flex-direction:row;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);font-size:15px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav [data-v=list]{display:none}
main{padding-bottom:32px}
body[data-view=wheel] main,body[data-view=list] main{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
body[data-view=wheel] .v-list,body[data-view=list] .v-wheel{display:block}
}
@media(max-width:380px){h1{font-size:19px}.set{flex-wrap:wrap}.set .seg{width:100%}}
@media(prefers-reduced-motion:reduce){.rays,.cf,.stage.win::after,.crown,.fin-rain,.fin-rays{display:none}.fin-tr,.fin-name{animation:none}}
</style>
</head>
<body data-view="wheel">
<header class="top"><h1>🎲 Tasodifiy tanlovchi</h1></header>
<nav>
<button data-v="wheel" class="on"><i>🎡</i><span>Baraban</span></button>
<button data-v="list"><i>📝</i><span>Ro’yxat</span></button>
<button data-v="simple"><i>🎯</i><span>Oddiy</span></button>
<button data-v="set"><i>⚙️</i><span>Sozlama</span></button>
</nav>
<main>
<section class="view v-wheel card">
<div class="stage" id="stage"><div class="ptr"></div><canvas id="cv" width="720" height="720" role="img" aria-label="Baraban"></canvas><div class="cf" id="cf"></div></div>
<div class="row c"><button class="tg" data-k="tri">🏆 3 g’olib</button><button class="tg" data-k="nr">♻️ Qaytmasin</button></div>
<div class="cnt" id="left" style="text-align:center;margin-bottom:8px"></div>
<button class="main" id="spin">AYLANTIRISH</button>
<div class="res" id="res" aria-live="polite"></div>
<div class="row" style="justify-content:space-between;margin-bottom:0"><b>Tarix</b><button class="sm" id="hclr">Tozalash</button></div>
<div class="chips" id="hist" style="justify-content:flex-start"></div>
</section>

<section class="view v-list card">
<div class="seg"><button id="mw" class="on">📝 So’zlar</button><button id="mi">🖼️ Rasmlar</button></div>
<div id="wbox">
<p class="cnt">Har qatorga bitta so’z yozing (100 tagacha).</p>
<textarea id="words" placeholder="Olma&#10;Anor&#10;Behi"></textarea>
<div class="cnt" id="wc"></div>
</div>
<div id="ibox" class="hide">
<div class="row"><label class="file">➕ Rasm qo’shish<input type="file" id="file" accept="image/*" multiple hidden></label><span class="cnt" id="ic"></span></div>
<div class="thumbs" id="th"></div>
</div>
<div class="row"><button class="sm" id="fill">100 ta namuna</button><button class="sm" id="shuf">🔀 Aralashtirish</button><button class="sm" id="clr">Tozalash</button><button class="sm" id="restore">↩ Tiklash</button></div>
</section>

<section class="view v-simple card">
<h2>🎯 Oddiy random</h2>
<p class="cnt">Har qatorga bitta so’z yozing.</p>
<textarea id="lines" placeholder="Birinchi&#10;Ikkinchi&#10;Uchinchi"></textarea>
<div class="row"><span class="cnt">Nechta tanlansin:</span><div class="seg" id="ssn" style="flex:1;min-width:180px"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
<div class="row"><button class="tg" data-k="snr">♻️ Qaytmasin</button></div>
<button class="main" id="pick">TOPISH</button>
<div class="out" id="out" aria-live="polite">—</div>
<div class="chips" id="shist"></div>
</section>

<section class="view v-set card">
<h2>⚙️ Sozlamalar</h2>
<div class="set"><span>Aylanish vaqti</span><div class="seg" id="sdur"><button data-v="4">4 s</button><button data-v="8">8 s</button><button data-v="12">12 s</button></div></div>
<div class="set"><span>🔊 Ovoz</span><button class="tg sw" data-k="sound"></button></div>
<div class="set"><span>📳 Tebranish <span class="cnt">(Android)</span></span><button class="tg sw" data-k="vib"></button></div>
<div class="set"><span>Mavzu</span><div class="seg" id="sth"><button data-v="auto">Avto</button><button data-v="light">Yorug’</button><button data-v="dark">Qorong’i</button></div></div>
<div class="set" style="border:0"><button class="sm" id="reset" style="width:100%">🗑 Hammasini boshlang’ich holatga qaytarish</button></div>
<p class="cnt">So’zlar va sozlamalar shu brauzerda saqlanadi. Rasmlar saqlanmaydi.</p>
</section>
</main>
<div class="fin" id="fin" role="dialog" aria-label="Oxirgi g’olib"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function ld(k){try{return localStorage.getItem('rnd_'+k)}catch(e){return null}}
function sv(k,v){try{localStorage.setItem('rnd_'+k,v)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rnd(n){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function ic(o){return o.src?'<img src="'+o.src+'" alt="">':''}
var DEF={tri:0,nr:0,snr:0,sound:1,vib:1,dur:8,theme:'auto',sn:1};
var opts=Object.assign({},DEF);try{Object.assign(opts,JSON.parse(ld('o')||'{}'))}catch(e){}
function saveO(){sv('o',JSON.stringify(opts))}
var SAMPLE='Olma\nAnor\nBehi\nUzum\nShaftoli\nNok';
var cv=$('cv'),cx=cv.getContext('2d'),W=cv.width,R=W/2-30;
var mode='words',angle=0,spinning=false,imgs=[],winIdx=-1,glow=14,pend=[],goneW=[],goneI=[],usedS=[],hist=[],loading=0,pr=false,busyS=false,lamp=0,popAmt=0,popT0=0,lastP=0,lastWin='';
var cols=['#6c4cf5','#e11d68','#0f9d8f','#d97706','#2563eb','#dc2626','#16a34a','#9333ea'];
var mq=window.matchMedia('(min-width:900px)');
var tt=null;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2200)}
function busy(){if(spinning){toast('Baraban aylanmoqda…');return true}return false}

function items(){
 if(mode==='words')return $('words').value.split('\n').map(function(s){return s.trim()}).filter(Boolean).slice(0,100).map(function(t){return{name:t}});
 return imgs.slice(0,20);
}
function segPath(k,s){cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,R,angle+k*s,angle+(k+1)*s);cx.closePath()}
function segDraw(i,n,s,it){
 var a0=angle+i*s,ci=i%cols.length;if(i===n-1&&ci===0&&n>1)ci=4;
 segPath(i,s);cx.fillStyle=cols[ci];cx.fill();
 if(winIdx<0&&n<=60){cx.strokeStyle='rgba(255,255,255,.4)';cx.lineWidth=1;cx.stroke()}
 cx.save();cx.rotate(a0+s/2);
 if(mode==='images'&&it[i].img){
  var r=Math.min(58,R*Math.sin(s/2)*.72),d=R*.7;
  cx.beginPath();cx.arc(d,0,r,0,7);cx.save();cx.clip();cx.drawImage(it[i].img,d-r,-r,r*2,r*2);cx.restore();
  cx.lineWidth=3;cx.strokeStyle='#fff';cx.beginPath();cx.arc(d,0,r,0,7);cx.stroke();
 }else if(mode==='words'&&n<=40){
  cx.fillStyle='#fff';cx.textAlign='right';cx.font='bold '+(n>28?20:n>16?25:30)+'px sans-serif';
  var t=it[i].name,m=n>28?16:n>16?14:13;if(t.length>m)t=t.slice(0,m-1)+'…';cx.fillText(t,R-18,8);
 }
 cx.restore();
}
function draw(){
 var it=items(),n=it.length,i;cx.clearRect(0,0,W,W);cx.save();cx.translate(W/2,W/2);
 cx.beginPath();cx.arc(0,0,R+10,0,7);cx.lineWidth=16;cx.strokeStyle='#2a2150';cx.stroke();
 for(i=0;i<24;i++){var q=i*Math.PI/12;cx.beginPath();cx.arc(Math.cos(q)*(R+10),Math.sin(q)*(R+10),4,0,7);cx.fillStyle=(i+lamp)%2===0?'#fde047':'rgba(255,255,255,.5)';cx.fill()}
 if(!n){cx.fillStyle='rgba(136,136,160,.3)';cx.beginPath();cx.arc(0,0,R,0,7);cx.fill();cx.fillStyle='#888';cx.font='bold 30px sans-serif';cx.textAlign='center';cx.fillText('Ro’yxat bo’sh',0,10);cx.restore();return}
 var s=2*Math.PI/n;
 for(i=0;i<n;i++)if(i!==winIdx)segDraw(i,n,s,it);
 if(winIdx>=0&&winIdx<n){
  cx.lineJoin='round';
  for(i=0;i<n;i++){if(i===winIdx)continue;segPath(i,s);cx.strokeStyle='#ef4444';cx.lineWidth=n>40?1.5:3;if(n<=30){cx.shadowColor='#ef4444';cx.shadowBlur=8}cx.stroke();cx.shadowBlur=0}
  var m=angle+winIdx*s+s/2,off=popAmt*20;
  cx.save();cx.translate(Math.cos(m)*off,Math.sin(m)*off);
  cx.shadowColor='rgba(0,0,0,.5)';cx.shadowBlur=20;segDraw(winIdx,n,s,it);cx.shadowBlur=0;
  segPath(winIdx,s);cx.strokeStyle='#22c55e';cx.lineWidth=9;cx.shadowColor='#22c55e';cx.shadowBlur=glow;cx.stroke();cx.stroke();cx.shadowBlur=0;
  cx.restore();
 }
 cx.beginPath();cx.arc(0,0,40,0,7);cx.fillStyle='#fff';cx.fill();cx.lineWidth=6;cx.strokeStyle='#6c4cf5';cx.stroke();
 cx.restore();
}
function counts(){
 $('wc').textContent=$('words').value.split('\n').filter(function(x){return x.trim()}).length+' / 100 so’z';
 $('ic').textContent=imgs.length+' / 20 rasm';
 var h='';imgs.forEach(function(o,i){h+='<div class="th"><img src="'+o.src+'" alt=""><button data-i="'+i+'" aria-label="O’chirish">×</button><input data-i="'+i+'" value="'+esc(o.name)+'" maxlength="30"></div>'});
 $('th').innerHTML=h;upLeft();
}
function refresh(){winIdx=-1;sv('w',$('words').value);counts();draw()}
function renderHist(){$('hist').innerHTML=hist.length?hist.map(function(o){return'<span class="chip">'+ic(o)+esc(o.name)+'</span>'}).join(''):'<span class="cnt">Hali g’olib yo’q</span>'}

/* ovoz va tebranish */
var ac=null,lastI=-1,lastT=0;
function aud(){if(!opts.sound)return null;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function beep(f,d,v){var a=aud();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function vibe(p){if(!opts.vib)return;try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function fanfare(){vibe([80,50,80,50,200]);beep(523,.25,.1);setTimeout(function(){beep(659,.25,.1)},140);setTimeout(function(){beep(784,.5,.1)},280)}
function tickCheck(n){var TP=2*Math.PI,i=Math.floor(((((-Math.PI/2-angle)%TP)+TP)%TP)/(TP/n));if(i!==lastI){lastI=i;var t=performance.now();if(t-lastT>30){lastT=t;vibe(10);beep(900+(i%2)*200,.04,.06)}}}

/* g'olib animatsiyasi */
function confetti(){
 if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 var cs=['#6c4cf5','#e11d68','#0f9d8f','#fbbf24','#2563eb','#22c55e'],h='';
 for(var i=0;i<28;i++){var a=Math.random()*Math.PI*2,d=90+Math.random()*130;
  h+='<i style="--x:'+Math.round(Math.cos(a)*d)+'px;--y:'+Math.round(Math.sin(a)*d-60)+'px;--r:'+Math.round(Math.random()*720-360)+'deg;background:'+cs[i%6]+';animation-delay:'+Math.round(Math.random()*120)+'ms"></i>'}
 $('cf').innerHTML=h;setTimeout(function(){$('cf').innerHTML=''},1800);
}
function pulse(t){
 if(winIdx<0||spinning||!cv.offsetParent){pr=false;return}
 var pe=Math.max(0,Math.min(1,(t-popT0)/600)),c=1.70158;
 popAmt=pe>=1?1:1+(c+1)*Math.pow(pe-1,3)+c*Math.pow(pe-1,2);
 if(pe<1||t-lastP>50){lastP=t;glow=14+10*Math.sin(t/220);lamp=Math.floor(t/300);draw()}
 requestAnimationFrame(pulse);
}
function startPulse(){if(!pr){pr=true;requestAnimationFrame(pulse)}}
function upLeft(){var e=$('left');if(!opts.nr){e.textContent='';return}var out=goneW.length+goneI.length+pend.length;e.textContent='♻️ Qolganlar: '+Math.max(0,items().length-pend.length)+' ta'+(out?' · chiqqanlar: '+out+' ta':'')}
function finaleSound(){[523,659,784,1047,988,1047,1319].forEach(function(f,i){setTimeout(function(){beep(f,.3,.12)},i*160)})}
function closeFin(){$('fin').classList.remove('on');$('fin').innerHTML=''}
function finale(o,total){
 lastWin=o.name;hist.unshift(o);hist=hist.slice(0,12);renderHist();
 var cs=['#fbbf24','#f59e0b','#fde68a','#e11d68','#6c4cf5','#22c55e'],r='';
 for(var i=0;i<36;i++)r+='<i style="left:'+Math.round(Math.random()*100)+'%;background:'+cs[i%6]+';animation-duration:'+(2.4+Math.random()*2.2).toFixed(1)+'s;animation-delay:'+(Math.random()*1.5).toFixed(1)+'s"></i>';
 $('fin').innerHTML='<div class="fin-rain">'+r+'</div><div class="fin-rays"></div><div class="fin-box"><div class="fin-tr">🏆</div><div class="fin-lab">OXIRGI G’OLIB</div>'+(o.src?'<img class="fin-img" src="'+o.src+'" alt="">':'')+'<div class="fin-name">'+esc(o.name)+'</div><div class="cnt">'+total+' ta ishtirokchi ichidan oxirgi qolgani</div><div class="row c" style="margin-bottom:0"><button class="sm" id="fnew">↩ Qaytadan boshlash</button><button class="main" id="fok" style="width:auto;padding:12px 24px">Ajoyib! 🎉</button></div></div>';
 $('fin').classList.add('on');$('fok').onclick=closeFin;$('fnew').onclick=function(){closeFin();$('restore').click()};
 finaleSound();vibe([120,60,120,60,120,60,400]);
}
function copyWin(){try{navigator.clipboard.writeText(lastWin).then(function(){toast('Nusxalandi')},function(){toast('Nusxalab bo’lmadi')})}catch(e){toast('Nusxalab bo’lmadi')}}

/* baraban */
function applyRemove(){
 if(!pend.length)return;
 if(mode==='words'){var L=$('words').value.split('\n');pend.forEach(function(o){var k=L.findIndex(function(x){return x.trim()===o.name});if(k>=0){L.splice(k,1);goneW.push(o.name)}});$('words').value=L.join('\n');sv('w',$('words').value)}
 else{pend.forEach(function(o){if(imgs.indexOf(o)>=0)goneI.push(o)});imgs=imgs.filter(function(o){return pend.indexOf(o)<0})}
 pend=[];counts();
}
function spin(){
 if(spinning)return;aud();applyRemove();
 var it=items(),n=it.length;if(n===1&&opts.nr&&(goneW.length||goneI.length)){winIdx=-1;draw();finale(it[0],goneW.length+goneI.length+1);return}if(n<2){toast('Kamida 2 ta element kerak');draw();return}if(n===2&&opts.nr&&(goneW.length||goneI.length))toast('🔥 Final! Faqat 2 ta qoldi');
 spinning=true;winIdx=-1;$('words').readOnly=true;$('res').innerHTML='';$('stage').classList.remove('win');$('spin').disabled=true;$('spin').textContent='AYLANMOQDA…';
 var w=rnd(n),s=2*Math.PI/n,TP=2*Math.PI,target=-Math.PI/2-(w+.5)*s;
 var delta=(((target-angle)%TP)+TP)%TP+TP*6,start=angle,t0=performance.now(),dur=opts.dur*1000;
 (function f(now){
  var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,5);
  angle=start+delta*e;lamp=Math.floor(angle*2);draw();tickCheck(n);
  if(p<1)requestAnimationFrame(f);
  else{spinning=false;$('words').readOnly=false;$('spin').disabled=false;$('spin').textContent='AYLANTIRISH';angle=angle%TP;show(w,it)}
 })(t0);
}
function show(w,it){
 $('stage').classList.add('win');winIdx=w;popT0=performance.now();popAmt=0;var all=[w];
 if(opts.tri&&it.length>=3){var o=[];for(var i=0;i<it.length;i++)if(i!==w)o.push(i);all=all.concat(shuf(o).slice(0,2))}
 pend=opts.nr?all.map(function(i){return it[i]}):[];upLeft();
 lastWin=all.map(function(i){return it[i].name}).join(', ');
 var h='<div class="win-wrap"><div class="rays"></div><span class="crown">👑</span><div class="big">'+ic(it[w])+'<span>'+esc(it[w].name)+'</span></div></div>';
 if(all.length>1)h+='<div class="cnt" style="margin-top:12px">🏆 3 ta g’olib</div><div class="chips">'+all.map(function(i,k){return'<span class="chip">'+(k+1)+'. '+ic(it[i])+esc(it[i].name)+'</span>'}).join('')+'</div>';
 h+='<div style="margin-top:10px"><button class="sm" id="cp">📋 Nusxalash</button></div>';
 $('res').innerHTML=h;$('cp').onclick=copyWin;
 hist.unshift(it[w]);hist=hist.slice(0,12);renderHist();
 fanfare();confetti();startPulse();
}
$('spin').onclick=spin;cv.onclick=spin;
$('hclr').onclick=function(){hist=[];renderHist()};
$('fin').onclick=function(e){if(e.target===this)closeFin()};
document.addEventListener('keydown',function(e){
 if(e.code==='Escape'){closeFin();return}if(e.code!=='Space'||$('fin').classList.contains('on'))return;var v=document.body.dataset.view;
 if(!(v==='wheel'||(v==='list'&&mq.matches)))return;
 if(/INPUT|TEXTAREA|BUTTON|SELECT/.test((document.activeElement||{}).tagName||''))return;
 e.preventDefault();spin();
});

/* ro'yxat */
function setMode(m){
 if(busy())return;mode=m;
 $('mw').classList.toggle('on',m==='words');$('mi').classList.toggle('on',m==='images');
 $('wbox').classList.toggle('hide',m!=='words');$('ibox').classList.toggle('hide',m!=='images');
 $('fill').classList.toggle('hide',m!=='words');
 pend=[];$('res').innerHTML='';$('stage').classList.remove('win');refresh();
}
$('mw').onclick=function(){setMode('words')};$('mi').onclick=function(){setMode('images')};
$('words').oninput=refresh;
$('clr').onclick=function(){if(busy())return;if(mode==='words')$('words').value='';else imgs=[];refresh()};
$('fill').onclick=function(){if(busy())return;var a=[];for(var i=1;i<=100;i++)a.push('So’z '+i);$('words').value=a.join('\n');refresh()};
$('shuf').onclick=function(){if(busy())return;if(mode==='words'){$('words').value=shuf($('words').value.split('\n').filter(function(x){return x.trim()})).join('\n')}else imgs=shuf(imgs);refresh()};
$('restore').onclick=function(){
 if(busy())return;pend=[];
 if(goneW.length){var v=$('words').value.replace(/\s+$/,'');$('words').value=(v?v+'\n':'')+goneW.join('\n')}
 goneW=[];goneI.forEach(function(o){if(imgs.length<20)imgs.push(o)});goneI=[];
 $('res').innerHTML='';$('stage').classList.remove('win');refresh();toast('Tiklandi');
};
$('th').onclick=function(e){var b=e.target.closest('button');if(!b||busy())return;imgs.splice(+b.dataset.i,1);refresh()};
$('th').oninput=function(e){var i=e.target.dataset.i;if(i!==undefined&&imgs[+i])imgs[+i].name=e.target.value};
$('file').onchange=function(e){
 if(busy())return;var fs=Array.prototype.slice.call(e.target.files);e.target.value='';
 fs.forEach(function(f){
  if(imgs.length+loading>=20){toast('20 tadan oshmaydi');return}
  loading++;var r=new FileReader();
  r.onerror=function(){loading--};
  r.onload=function(){var im=new Image();
   im.onerror=function(){loading--;toast('Rasm ochilmadi')};
   im.onload=function(){var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d'),m=Math.min(im.width,im.height);
    x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);
    var sm=c.toDataURL('image/jpeg',.82),i2=new Image();
    i2.onload=function(){loading--;if(imgs.length<20){imgs.push({name:f.name.replace(/\.[^.]+$/,'').slice(0,30),src:sm,img:i2});refresh()}};i2.src=sm};
   im.src=r.result};
  r.readAsDataURL(f);
 });
};

/* oddiy random */
$('lines').oninput=function(){sv('l',this.value)};
$('pick').onclick=function(){
 if(busyS)return;aud();
 var a=$('lines').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
 if(!a.length){toast('Avval so’zlarni yozing');return}
 sv('l',$('lines').value);
 var pool=opts.snr?a.filter(function(x){return usedS.indexOf(x)<0}):a;
 if(!pool.length){usedS=[];pool=a;$('shist').innerHTML=''}
 var res=shuf(pool).slice(0,Math.min(opts.sn,pool.length)),k=0,box=$('out');
 busyS=true;$('pick').disabled=true;box.classList.remove('hit');
 (function tick(){
  box.textContent=a[rnd(a.length)];beep(600+k*18,.03,.05);vibe(10);k++;
  if(k<22){setTimeout(tick,50+k*k*.9);return}
  box.innerHTML='🎉 '+(res.length>1?res.map(function(x,i){return(i+1)+'. '+esc(x)}).join('<br>'):esc(res[0]));
  box.classList.add('hit');fanfare();busyS=false;$('pick').disabled=false;
  res.forEach(function(x){usedS.push(x);var c=document.createElement('span');c.className='chip';c.textContent=x;$('shist').insertBefore(c,$('shist').firstChild)});
  while($('shist').children.length>10)$('shist').removeChild($('shist').lastChild);
 })();
};

/* sozlamalar */
var ups=[];
function bindSeg(id,key,num){var bs=$(id).querySelectorAll('button');function up(){bs.forEach(function(x){x.classList.toggle('on',String(opts[key])===x.dataset.v)})}bs.forEach(function(x){x.onclick=function(){opts[key]=num?+x.dataset.v:x.dataset.v;saveO();up();if(key==='theme')applyTheme()}});ups.push(up);up()}
function syncSeg(){ups.forEach(function(f){f()})}
function syncTg(){document.querySelectorAll('.tg').forEach(function(b){b.classList.toggle('on',!!opts[b.dataset.k])})}
function applyTheme(){var r=document.documentElement;if(opts.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',opts.theme)}
bindSeg('sdur','dur',1);bindSeg('sth','theme',0);bindSeg('ssn','sn',1);
document.querySelectorAll('.tg').forEach(function(b){b.onclick=function(){var k=b.dataset.k;opts[k]=opts[k]?0:1;saveO();syncTg();upLeft();if(k==='vib'&&opts.vib)vibe(40);if(k==='sound'&&opts.sound)beep(700,.08,.08)}});
var rt=null,RL='🗑 Hammasini boshlang’ich holatga qaytarish';
$('reset').onclick=function(){
 var b=this;
 if(!rt){b.textContent='Aniq o’chirilsinmi? Yana bosing';rt=setTimeout(function(){rt=null;b.textContent=RL},4000);return}
 clearTimeout(rt);rt=null;b.textContent=RL;if(busy())return;
 try{['o','w','l'].forEach(function(k){localStorage.removeItem('rnd_'+k)})}catch(e){}
 opts=Object.assign({},DEF);imgs=[];goneW=[];goneI=[];pend=[];hist=[];usedS=[];
 $('words').value=SAMPLE;$('lines').value='';$('res').innerHTML='';$('stage').classList.remove('win');$('shist').innerHTML='';$('out').textContent='—';$('out').classList.remove('hit');
 closeFin();saveO();syncTg();syncSeg();applyTheme();renderHist();refresh();toast('Tozalandi');
};

/* navigatsiya */
function setView(v){
 document.body.dataset.view=v;var dv=(v==='list'&&mq.matches)?'wheel':v;
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===dv)});
 window.scrollTo(0,0);if(winIdx>=0&&!spinning)startPulse();
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){setView(b.dataset.v)}});

/* boshlash */
var lw=ld('w');$('words').value=lw!==null?lw:SAMPLE;
var ll=ld('l');if(ll!==null)$('lines').value=ll;
syncTg();applyTheme();renderHist();refresh();
})();
</script>
